<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ handle }}'s ProblemSet</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f5f5f5;
      margin: 0;
    }

    h1 {
      text-align: center;
      margin-bottom: 1rem;
      padding: 0 2rem;
    }

    form {
      text-align: center;
      margin-left: 2rem;
      display: flex;
      align-items: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
      padding: 0 2rem;
      margin-top: 2rem;
    }

    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #eee;
      font-weight: bold;
    }

    tr.solved {
      background-color: #e6ffed;
    }

    .rating {
      font-weight: bold;
    }

    .r800 { color: green; }
    .r1200 { color: darkgreen; }
    .r1400 { color: orange; }
    .r1600 { color: orangered; }
    .r1800, .r2000 { color: red; }
    .r2200 { color: darkred; }

    a {
      color: #007acc;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    #nav {
      background: black;
      height: 4rem;
      display: flex;
      align-items: center;
      padding-left: 1rem;
    }

    #title {
      font-size: 2rem;
      color: white;
    }

    button {
      background: dimgrey;
      border: none;
      font-size: 1rem;
      border-radius: 2px;
    }

    button:hover {
      cursor: pointer;
    }

    #balls {
      margin-left: 0.2rem;
    }
  </style>
</head>
<body>
  <div id="nav">
    <div id="title">TITLE</div>
    <form method="POST" action="/table">
      <input name="handle" value="{{handle if handle else '' }}" placeholder="Enter handle..." required>
      <button id="balls" type="submit">Go</button>
    </form>
  </div>

  <table>
    <thead>
      <tr>
        <th>Problem</th>
        <th>Rating</th>
        <th>Contest</th>
      </tr>
    </thead>
    <tbody>
      {% for p, solved in problems %}
      <tr class="{{ 'solved' if solved else '' }}">
        <td>
          <a href="{{ p[2] }}" target="_blank">{{ p[1] }}</a>
        </td>
        <td class="rating r{{ (p[5] or 800) // 200 * 200 }}">{{ p[4] or 'Unrated' }}</td>
        <td>
          {% if p[3] and p[4] %}
          <p>{{ p[4] }}</p>
          {% else %}N/A{% endif %}
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
